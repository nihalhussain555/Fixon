<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex">
  <title>FIXON admin - Manage products</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="toasts"></div>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="admin.js"></script>
  <script>
    (function () {
      "use strict";
      var A = window.fixonAdmin, el = A.el;
      var S = window.fixonSupabase;

      var SORTS = {
        newest: function (a, b) { return new Date(b.created_at) - new Date(a.created_at); },
        oldest: function (a, b) { return new Date(a.created_at) - new Date(b.created_at); },
        "price-high": function (a, b) { return (Number(b.price) || 0) - (Number(a.price) || 0); },
        "price-low": function (a, b) { return (Number(a.price) || 0) - (Number(b.price) || 0); }
      };

      A.guard("products", "Manage products", function (session, body) {
        var state = { rows: [], q: "", cat: "all", avail: "all", sort: "newest", page: 1, size: 25 };

        /* ---------------------------------------------------------- toolbar */
        var bar = el("section", "filter-bar");

        var search = el("input");
        search.type = "search";
        search.placeholder = "Search by name or description...";
        search.setAttribute("aria-label", "Search products by name or description");

        var catSel = el("select");
        catSel.setAttribute("aria-label", "Filter by category");
        var availSel = el("select");
        availSel.setAttribute("aria-label", "Filter by availability");
        [["all", "Any status"], ["active", "Active only"], ["hidden", "Hidden only"], ["out", "Out of stock"], ["instock", "In stock"]].forEach(function (o) {
          var opt = el("option", null, o[1]); opt.value = o[0]; availSel.appendChild(opt);
        });
        var sortSel = el("select");
        sortSel.setAttribute("aria-label", "Sort products");
        [["newest", "Newest first"], ["oldest", "Oldest first"], ["price-high", "Price: high to low"], ["price-low", "Price: low to high"]].forEach(function (o) {
          var opt = el("option", null, o[1]); opt.value = o[0]; sortSel.appendChild(opt);
        });

        var reset = el("button", "btn btn-ghost btn-sm");
        reset.type = "button";
        reset.appendChild(A.icon("x"));
        reset.appendChild(el("span", null, "Clear"));
        reset.hidden = true;

        var addBtn = el("a", "btn btn-primary btn-sm");
        addBtn.href = "add-product.html";
        addBtn.appendChild(A.icon("plus"));
        addBtn.appendChild(el("span", null, "Add product"));

        var count = el("span", "count", "");

        bar.appendChild(search);
        bar.appendChild(catSel);
        bar.appendChild(availSel);
        bar.appendChild(sortSel);
        bar.appendChild(reset);
        bar.appendChild(el("span", "spacer"));
        bar.appendChild(count);
        bar.appendChild(addBtn);
        body.appendChild(bar);

        var host = el("section", "panel flush");
        body.appendChild(host);

        search.addEventListener("input", function () { state.q = search.value.trim().toLowerCase(); state.page = 1; paint(); });
        catSel.addEventListener("change", function () { state.cat = catSel.value; state.page = 1; paint(); });
        availSel.addEventListener("change", function () { state.avail = availSel.value; state.page = 1; paint(); });
        sortSel.addEventListener("change", function () { state.sort = sortSel.value; paint(); });
        reset.addEventListener("click", function () {
          search.value = ""; catSel.value = "all"; availSel.value = "all"; sortSel.value = "newest";
          state.q = ""; state.cat = "all"; state.avail = "all"; state.sort = "newest"; state.page = 1;
          paint();
          search.focus();
        });

        function filtered() {
          return state.rows.filter(function (p) {
            if (state.q) {
              var hay = (String(p.name) + " " + String(p.description) + " " + String(p.category)).toLowerCase();
              if (hay.indexOf(state.q) === -1) return false;
            }
            if (state.cat !== "all") {
              if (A.categoryLabel(p.category).toLowerCase() !== state.cat) return false;
            }
            if (state.avail === "active" && !p.is_active) return false;
            if (state.avail === "hidden" && p.is_active) return false;
            if (state.avail === "out" && !A.isOutOfStock(p)) return false;
            if (state.avail === "instock" && (p.stock === null || p.stock === undefined || Number(p.stock) === 0)) return false;
            return true;
          }).sort(SORTS[state.sort] || SORTS.newest);
        }

        function reload() {
          host.textContent = "";
          host.appendChild(A.skeletonRows(6));
          S.listProducts().then(function (rows) {
            state.rows = rows;
            fillCategories();
            paint();
          }, function (err) {
            host.textContent = "";
            if (err && err.code === "signed_out") { window.location.replace("login.html"); return; }
            var box = el("div", "notice error");
            box.appendChild(A.icon("x-circle"));
            box.appendChild(el("span", null, (err && err.message) || "The products could not be loaded."));
            host.appendChild(box);
            var again = el("button", "btn btn-ghost", "Try again");
            again.type = "button";
            again.addEventListener("click", reload);
            host.appendChild(again);
          });
        }

        function fillCategories() {
          var current = String(catSel.value || "all").toLowerCase();
          catSel.textContent = "";
          var all = el("option", null, "All categories"); all.value = "all";
          catSel.appendChild(all);
          var seen = {};
          state.rows.forEach(function (p) {
            var label = A.categoryLabel(p.category);
            var key = label.toLowerCase();
            if (label && !seen[key]) {
              seen[key] = true;
              var opt = el("option", null, label);
              opt.value = key;
              catSel.appendChild(opt);
            }
          });
          catSel.value = (current === "all" || seen[current]) ? current : "all";
        }

        function paint() {
          host.textContent = "";
          var rows = filtered();
          var pages = Math.max(1, Math.ceil(rows.length / state.size));
          if (state.page > pages) state.page = pages;
          var from = (state.page - 1) * state.size;
          var slice = rows.slice(from, from + state.size);
          var filtering = !!(state.q || state.cat !== "all" || state.avail !== "all");
          reset.hidden = !filtering;
          count.textContent = rows.length === state.rows.length
            ? state.rows.length + (state.rows.length === 1 ? " product" : " products")
            : rows.length + " of " + state.rows.length + " shown";

          if (!state.rows.length) {
            host.appendChild(A.emptyState({
              icon: "box",
              title: "No products in the shop yet",
              message: "This table is the whole catalog: whatever is saved here is what the storefront shows its visitors.",
              actions: [{ label: "Add the first product", href: "add-product.html" }]
            }));
            return;
          }
          if (!rows.length) {
            host.appendChild(A.emptyState({
              icon: "search",
              title: "Nothing matches those filters",
              message: "Try a shorter search, or clear the filters to see all " + state.rows.length + " products again.",
              actions: [{
                label: "Clear filters", kind: "btn-ghost",
                onClick: function () { reset.click(); }
              }]
            }));
            return;
          }

          var wrap = el("div", "table-wrap");
          var table = el("table", "data");
          var thead = el("thead");
          var hr = el("tr");
          ["Photo", "Product", "Category", "Price", "Stock", "Status", "Added", "Actions"].forEach(function (t, i) {
            var th = el("th", null, i === 0 ? "" : t);
            if (i === 7) th.style.textAlign = "right";
            hr.appendChild(th);
          });
          thead.appendChild(hr);
          table.appendChild(thead);

          var tbody = el("tbody");
          slice.forEach(function (p) { tbody.appendChild(rowFor(p)); });
          table.appendChild(tbody);
          wrap.appendChild(table);
          host.appendChild(wrap);

          /* Shown for any list longer than the smallest page size, not just
             when there is more than one page: picking 100 per page would
             otherwise hide the control that lets you pick it back down. */
          if (rows.length > 10) host.appendChild(pager(rows.length, pages));
        }

        function pager(totalRows, pages) {
          var box = el("div", "pager");
          var from = (state.page - 1) * state.size + 1;
          var to = Math.min(totalRows, state.page * state.size);
          box.appendChild(el("span", "page-size", "Showing " + from + "-" + to + " of " + totalRows));

          var btns = el("div", "pager-btns");
          var prev = el("button", "btn btn-ghost btn-sm");
          prev.type = "button";
          prev.appendChild(A.icon("chevron-left"));
          prev.appendChild(el("span", null, "Prev"));
          prev.disabled = state.page <= 1;
          prev.addEventListener("click", function () { state.page--; paint(); });

          var label = el("span", "page-no", "Page " + state.page + " of " + pages);
          label.setAttribute("aria-live", "polite");

          var next = el("button", "btn btn-ghost btn-sm");
          next.type = "button";
          next.appendChild(el("span", null, "Next"));
          next.appendChild(A.icon("chevron-right"));
          next.disabled = state.page >= pages;
          next.addEventListener("click", function () { state.page++; paint(); });

          btns.appendChild(prev);
          btns.appendChild(label);
          btns.appendChild(next);
          box.appendChild(btns);

          var size = el("div", "page-size");
          size.appendChild(el("span", null, "Per page"));
          var sel = el("select");
          sel.setAttribute("aria-label", "Products shown per page");
          [10, 25, 50, 100].forEach(function (n) {
            var o = el("option", null, String(n)); o.value = String(n);
            if (n === state.size) o.selected = true;
            sel.appendChild(o);
          });
          sel.addEventListener("change", function () { state.size = Number(sel.value) || 25; state.page = 1; paint(); });
          size.appendChild(sel);
          box.appendChild(size);
          return box;
        }

        /* Every write goes through the same busy/refresh handling: a row's
           buttons stop the moment its save starts, an error is named, and a
           successful change re-reads the list so the table always shows what
           the database actually holds - not what the form hoped for. */
        function withBusy(buttons, work, rowName, doneMessage) {
          buttons.forEach(function (b) { b.disabled = true; });
          work().then(function () {
            A.toast((rowName || "The product") + (doneMessage || " updated."), "success");
            reload();
          }, function (err) {
            if (err && err.code === "signed_out") { window.location.replace("login.html"); return; }
            A.toast((err && err.message) || "The update failed.", "error");
            buttons.forEach(function (b) { b.disabled = false; });
          });
        }

        function photoCell(p) {
          var td = el("td");
          if (p.image_url) {
            var img = el("img", "thumb");
            img.src = p.image_url;
            img.alt = "";
            img.loading = "lazy";
            img.decoding = "async";
            td.appendChild(img);
          } else {
            var none = el("span", "thumb-none");
            none.appendChild(A.icon("image"));
            none.setAttribute("title", "No photo saved - the shop shows this product's category illustration");
            td.appendChild(none);
          }
          return td;
        }

        function rowFor(p) {
          var tr = el("tr");

          tr.appendChild(photoCell(p));

          var tdName = el("td", "name-cell");
          tdName.appendChild(el("b", null, p.name));
          if (p.description) tdName.appendChild(el("span", null, p.description));
          tr.appendChild(tdName);

          tr.appendChild(el("td", null, A.categoryLabel(p.category) || "—"));

          /* Price: inline edit, blank keeps "Price on request". */
          var tdPrice = el("td", "price");
          var priceForm = el("form", "inline-form");
          var priceIn = el("input");
          priceIn.type = "text";
          priceIn.inputMode = "decimal";
          priceIn.value = p.price === null || p.price === undefined ? "" : String(p.price);
          priceIn.placeholder = "—";
          priceIn.setAttribute("aria-label", "Price for " + p.name);
          var priceBtn = el("button", "btn btn-quiet btn-sm", "Save");
          priceBtn.type = "submit";
          priceForm.appendChild(priceIn);
          priceForm.appendChild(priceBtn);
          priceForm.addEventListener("submit", function (e) {
            e.preventDefault();
            if (priceBtn.disabled) return;
            withBusy([priceBtn], function () {
              return S.updateProduct(p.id, formValues(p, { price: priceIn.value }));
            }, p.name, "'s price is updated.");
          });
          tdPrice.appendChild(priceForm);
          tr.appendChild(tdPrice);

          /* Stock: inline edit; empty means "not tracked". */
          var tdStock = el("td");
          var stockForm = el("form", "inline-form");
          var stockIn = el("input");
          stockIn.type = "number";
          stockIn.min = "0"; stockIn.step = "1";
          stockIn.value = p.stock === null || p.stock === undefined ? "" : String(p.stock);
          stockIn.placeholder = "—";
          stockIn.setAttribute("aria-label", "Stock for " + p.name);
          var stockBtn = el("button", "btn btn-quiet btn-sm", "Save");
          stockBtn.type = "submit";
          stockForm.appendChild(stockIn);
          stockForm.appendChild(stockBtn);
          stockForm.addEventListener("submit", function (e) {
            e.preventDefault();
            if (stockBtn.disabled) return;
            withBusy([stockBtn], function () {
              return S.updateProduct(p.id, formValues(p, { stock: stockIn.value }));
            }, p.name, "'s stock is updated.");
          });
          tdStock.appendChild(stockForm);
          tr.appendChild(tdStock);

          var tdState = el("td");
          tdState.appendChild(A.statusPill(p));
          tr.appendChild(tdState);

          tr.appendChild(el("td", "muted nowrap", A.fmtDate(p.created_at)));

          var tdAct = el("td", "acts");

          var tog = el("button", "btn btn-ghost btn-sm");
          tog.type = "button";
          tog.appendChild(A.icon(p.is_active ? "eye-off" : "eye"));
          tog.appendChild(el("span", null, p.is_active ? "Hide" : "Show"));
          tog.title = p.is_active ? "Hide this product from customers" : "Show this product on the shop";
          tog.addEventListener("click", function () {
            withBusy([tog], function () {
              return S.updateProduct(p.id, formValues(p, { is_active: !p.is_active }));
            }, p.name, p.is_active ? " is now hidden from customers." : " is live on the shop.");
          });
          tdAct.appendChild(tog);

          var edit = el("a", "btn btn-ghost btn-sm");
          edit.href = "edit-product.html?id=" + encodeURIComponent(p.id);
          edit.appendChild(A.icon("pencil"));
          edit.appendChild(el("span", null, "Edit"));
          tdAct.appendChild(edit);

          var del = el("button", "btn btn-danger btn-sm");
          del.type = "button";
          del.appendChild(A.icon("trash"));
          del.appendChild(el("span", null, "Delete"));
          del.addEventListener("click", function () {
            /* The dialog names the product, because "Delete?" alone is how a
               shop owner ends up removing the wrong row. */
            A.confirmAction({
              title: "Delete this product?",
              message: "\"" + p.name + "\"" + (p.price ? " (" + A.money(p.price) + ")" : "") + " will be removed from the shop for good.",
              detail: p.image_url
                ? "Its uploaded photo is deleted from storage too - but only when no other product still uses that same file."
                : "This product has no uploaded photo, so nothing in storage changes.",
              confirmLabel: "Delete product"
            }).then(function (yes) {
              if (!yes) return;
              A.busy(del, true);
              edit.style.pointerEvents = "none";
              S.deleteProduct(p.id).then(function () {
                /* Safe cleanup, never a blind delete: the helper checks every
                   row before removing the object and refuses external URLs. */
                return S.deleteImageByUrl(p.image_url);
              }).then(function () {
                A.toast(p.name + " deleted.", "success");
                reload();
              }, function (err) {
                if (err && err.code === "signed_out") { window.location.replace("login.html"); return; }
                A.toast((err && err.message) || "The delete failed.", "error");
                A.busy(del, false);
                edit.style.pointerEvents = "";
              });
            });
          });
          tdAct.appendChild(del);
          tr.appendChild(tdAct);

          /* The stacked mobile layout reads each cell's heading from here. */
          var labels = ["", "Product", "Category", "Price", "Stock", "Status", "Added", ""];
          for (var i = 0; i < tr.children.length; i++) {
            if (labels[i]) tr.children[i].dataset.label = labels[i];
          }
          return tr;
        }

        /* updateProduct PATCHes the whole row, so an inline change still has
           to send the row's other columns unchanged - read back from the
           database copy this row arrived as, never re-typed from the form. */
        function formValues(p, changed) {
          var v = {
            name: p.name,
            description: p.description,
            price: p.price,
            category: p.category,
            image_url: p.image_url,
            stock: p.stock,
            stock_note: p.stock_note,
            featured: p.featured,
            is_active: p.is_active
          };
          Object.keys(changed).forEach(function (k) { v[k] = changed[k]; });
          return v;
        }

        reload();
      });
    })();
  </script>
</body>
</html>
