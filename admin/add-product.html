<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>FIXON admin - Add product</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="toasts"></div>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="admin.js"></script>
  <script src="admin-form.js"></script>
  <script>
    (function () {
      "use strict";
      var A = window.fixonAdmin, el = A.el;

      A.guard("add", "Add product", function (session, body) {
        var host = el("section", "panel");
        host.id = "formHost";
        body.appendChild(host);
        var hint = el("p", null, "A new product appears on the shop as soon as it is created - leave \"Active\" ticked to publish it now, or untick it to save a draft only admins can see.");
        hint.style.cssText = "color:var(--muted);font-size:.84rem;margin:0;";
        body.appendChild(hint);
        window.fixonAdminForm.start("add", null);
      });
    })();
  </script>
</body>
</html>
