<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex">
  <title>FIXON admin - Edit product</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="toasts"></div>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="admin.js"></script>
  <script src="admin-form.js"></script>
  <script>
    (function () {
      "use strict";
      var A = window.fixonAdmin, el = A.el;

      A.guard("products", "Edit product", function (session, body) {
        /* The id in the address is only ever used as a query parameter,
           never as HTML - a shared "edit-product.html?id=<anything>" link
           cannot inject anything into this page. */
        var id = new URLSearchParams(window.location.search).get("id") || "";

        var back = el("a", "btn btn-ghost btn-sm");
        back.href = "products.html";
        back.appendChild(A.icon("chevron-left"));
        back.appendChild(el("span", null, "All products"));
        body.appendChild(back);

        var host = el("div", "stack");
        host.id = "formHost";
        body.appendChild(host);

        host.appendChild(A.skeletonStats(2));
        host.appendChild(A.loadingLine("Loading this product from Supabase..."));

        if (!id) {
          host.textContent = "";
          host.appendChild(A.emptyState({
            icon: "search",
            title: "No product to edit",
            message: "This page needs a product. Open one from Manage products and press Edit.",
            actions: [{ label: "Manage products", href: "products.html" }]
          }));
          return;
        }

        window.fixonSupabase.getProduct(id).then(function (row) {
          host.textContent = "";
          if (!row) {
            host.appendChild(A.emptyState({
              icon: "search",
              title: "That product is not here",
              message: "It may have been deleted, or the link points at the internal id of a product visitors cannot see.",
              actions: [{ label: "Back to Manage products", href: "products.html" }]
            }));
            return;
          }
          document.title = "FIXON admin - Edit " + row.name;

          var was = el("div", "notice info");
          was.appendChild(A.icon("calendar"));
          was.appendChild(el("span", null, "Saved on " + A.fmtDateTime(row.created_at) +
            (row.updated_at && new Date(row.updated_at) - new Date(row.created_at) > 60000 ? ", last changed " + A.timeAgo(row.updated_at) : "") +
            ". Changing the photo uploads the new file first; the old one is only deleted from storage when no other product uses it."));
          host.appendChild(was);

          window.fixonAdminForm.start("edit", row);
        }, function (err) {
          host.textContent = "";
          if (err && err.code === "signed_out") { window.location.replace("login.html"); return; }
          var box = el("div", "notice error");
          box.appendChild(A.icon("x-circle"));
          box.appendChild(el("span", null, (err && err.message) || "The product could not be loaded."));
          host.appendChild(box);
          var again = el("button", "btn btn-ghost", "Try again");
          again.type = "button";
          again.addEventListener("click", function () { window.location.reload(); });
          host.appendChild(again);
        });
      });
    })();
  </script>
</body>
</html>
